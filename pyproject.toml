[project]
name = "sas2parquet"
version = "0.1.0"
description = "Fast, memory-safe SAS (.sas7bdat) to Parquet converter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.30",
    "polars-readstat>=0.20",
    "pyreadstat>=1.2",
    "pyarrow>=16",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sas2parquet = "sas2parquet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sas2parquet"]
